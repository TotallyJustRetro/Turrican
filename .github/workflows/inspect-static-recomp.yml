name: Inspect Mega Turrican runtime hooks

on:
  push:
    branches: [feature/audio-settings-and-icon]
    paths:
      - '.github/workflows/inspect-static-recomp.yml'
      - 'build-overrides/inspect-static-recomp.py'

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decrypt private source bundle
        env:
          MEGATURRICAN_SOURCE_KEY: \${{ secrets.MEGATURRICAN_SOURCE_KEY }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -in MegaTurrican_Windows_Build_Kit.zip.enc \
            -out /tmp/MegaTurrican_Windows_Build_Kit.zip \
            -pass env:MEGATURRICAN_SOURCE_KEY
          mkdir -p /tmp/mt-source
          unzip -q /tmp/MegaTurrican_Windows_Build_Kit.zip -d /tmp/mt-source

      - name: Report runtime symbol names only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/mt-source/MegaTurrican_Windows_Build_Kit")
          report = []
          files = [
              "recomp_gen.c", "runtime/harness.c", "runtime/m68k_interp.c",
              "runtime/vdp.h", "runtime/vdp.c", "runtime/z80.c",
              "runtime/ym2612.c", "runtime/psg.c"
          ]
          type_pat = r"(?:unsigned\s+)?(?:u?int(?:8|16|32|64)_t|char|short|int|long|size_t|bool|struct\s+\w+)"
          decl = re.compile(r"^\s*(?:(?:static|extern|volatile|const)\s+)*(" + type_pat + r")\s+[*\s]*([A-Za-z_]\w*)\s*(\[[^\]]*\])?\s*(?:=|;|,)")
          func = re.compile(r"^\s*(?:(?:static|inline|extern)\s+)*(?:" + type_pat + r"|[A-Z]\w*)\s+([A-Za-z_]\w*)\s*\(([^;{}]*)\)\s*[;{]")
          interesting = re.compile(r"ram|mem|rom|cpu|m68k|z80|reg|state|vdp|ym|psg|read|write|save|load|frame|execute", re.I)
          for rel in files:
              path = root / rel
              if not path.exists():
                  continue
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              report.append(f"[{rel}] {len(lines)} lines")
              found = set()
              for n, line in enumerate(lines, 1):
                  m = decl.match(line)
                  if m and (rel != "recomp_gen.c" or interesting.search(m.group(2))):
                      found.add(f"GLOBAL line={n} type={m.group(1).strip()} name={m.group(2)} array={m.group(3) or '-'}")
                  f = func.match(line)
                  if f and interesting.search(f.group(1)):
                      params = re.sub(r"\s+", " ", f.group(2).strip())
                      found.add(f"FUNCTION line={n} name={f.group(1)} params={params[:120] or '-'}")
                  if rel in ("runtime/harness.c", "runtime/m68k_interp.c", "runtime/vdp.h") and interesting.search(line):
                      if re.match(r"^\s*(?:#define|typedef|enum|struct)\b", line):
                          names = re.findall(r"[A-Za-z_]\w*", line)
                          safe_names = [x for x in names if interesting.search(x)]
                          if safe_names:
                              found.add(f"TYPEDEF line={n} names={','.join(safe_names[:10])}")
              report.extend(sorted(found))
          output = Path("runtime-hooks.txt")
          output.write_text("\n".join(report) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload runtime symbol report
        uses: actions/upload-artifact@v4
        with:
          name: MegaTurrican-runtime-symbol-report
          path: runtime-hooks.txt
          retention-days: 3
