name: Build Mega Turrican for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, fix/genesis-controller-port-bits, feature/remember-rom-location, feature/audio-settings-and-icon]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'build-overrides/**'
      - 'MegaTurrican_Windows_Build_Kit.zip.enc'

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate encrypted source and secret
        shell: pwsh
        env:
          MEGATURRICAN_SOURCE_KEY: ${{ secrets.MEGATURRICAN_SOURCE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MEGATURRICAN_SOURCE_KEY)) {
            throw 'Missing repository Actions secret MEGATURRICAN_SOURCE_KEY.'
          }
          if (-not (Test-Path (Join-Path $PWD 'MegaTurrican_Windows_Build_Kit.zip.enc'))) {
            throw 'Missing MegaTurrican_Windows_Build_Kit.zip.enc in the repository root.'
          }

      - name: Install MinGW-w64, SDL2, and OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-openssl

      - name: Decrypt private source bundle
        shell: msys2 {0}
        env:
          MEGATURRICAN_SOURCE_KEY: ${{ secrets.MEGATURRICAN_SOURCE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MEGATURRICAN_SOURCE_KEY"
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 -in MegaTurrican_Windows_Build_Kit.zip.enc -out MegaTurrican_Windows_Build_Kit.zip -pass env:MEGATURRICAN_SOURCE_KEY
          test -s MegaTurrican_Windows_Build_Kit.zip

      - name: Extract and validate private source bundle
        shell: pwsh
        run: |
          $destination = Join-Path $PWD '_build-source'
          Expand-Archive -LiteralPath (Join-Path $PWD 'MegaTurrican_Windows_Build_Kit.zip') -DestinationPath $destination -Force
          $project = Join-Path $destination 'MegaTurrican_Windows_Build_Kit'
          foreach ($required in @('recomp_gen.c', 'runtime/harness.c', 'launcher/package.json', 'config.ini')) {
            if (-not (Test-Path (Join-Path $project $required))) {
              throw "Source bundle is incomplete: $required is missing."
            }
          }
          $patchScript = Join-Path $PWD 'build-overrides/patch-launcher.ps1'
          if (-not (Test-Path $patchScript)) { throw 'Launcher patch script is missing.' }
          & $patchScript -ProjectRoot $project

          # Install the updated in-game pause/options menu from the supplied WindowsPort source.
          $menuPayload = Join-Path $PWD 'build-overrides/ingame-menu-sdl_main.c.gz.b64'
          if (-not (Test-Path -LiteralPath $menuPayload)) { throw 'Updated in-game menu source payload is missing.' }
          $compressed = [Convert]::FromBase64String((Get-Content -LiteralPath $menuPayload -Raw).Trim())
          $inputStream = [System.IO.MemoryStream]::new($compressed)
          $outputStream = [System.IO.MemoryStream]::new()
          $gzipStream = [System.IO.Compression.GZipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
          try { $gzipStream.CopyTo($outputStream) } finally { $gzipStream.Dispose(); $inputStream.Dispose() }
          $menuSourcePath = Join-Path $project 'runtime/sdl_main.c'
          [System.IO.File]::WriteAllBytes($menuSourcePath, $outputStream.ToArray())
          $outputStream.Dispose()
          $menuHash = (Get-FileHash -LiteralPath $menuSourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($menuHash -ne '96981beaa64122b40786dfdac8788323f582979bb26a88c4584ab42777f1deaa') {
            throw "Updated in-game menu source checksum mismatch: $menuHash"
          }
          Write-Host 'Installed updated in-game pause/options menu source.'

          "MEGATURRICAN_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Set up Python for build patches
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect native title and intro source
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/inspect-reborn-internals.py') $env:MEGATURRICAN_PROJECT (Join-Path $PWD 'reborn-source-inspection.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Inspecting native title and intro source failed.' }
          Get-Content (Join-Path $PWD 'reborn-source-inspection.txt') -Raw
      - name: Upload native title source inspection
        uses: actions/upload-artifact@v4
        with:
          name: MegaTurrican-Reborn-Source-Inspection
          path: reborn-source-inspection.txt
          retention-days: 7

      - name: Install Pillow for Windows icon conversion
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Installing Pillow for icon conversion failed.' }

      - name: Apply Genesis controller UI and native mappings
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-controller-menu.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Applying Genesis controller changes failed.' }

      - name: Apply launcher audio options and game icon
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-audio.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Applying audio and icon changes failed.' }

      - name: Embed Reborn intro and persistent title branding
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-reborn-title.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Embedding the Reborn title animation failed.' }

      - name: Compile native Windows game core
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/build-overrides"
          windres MegaTurrican.rc -O coff -o "$(cygpath -u "$MEGATURRICAN_PROJECT")/MegaTurrican-icon.o"
          cd "$(cygpath -u "$MEGATURRICAN_PROJECT")"
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime recomp_gen.c runtime/harness.c runtime/vdp.c runtime/m68k_interp.c runtime/z80.c runtime/ym2612.c runtime/psg.c runtime/sdl_main.c MegaTurrican-icon.o $(sdl2-config --libs) -lm -static-libgcc -mwindows -o MegaTurrican.exe
          test -s MegaTurrican.exe
          mkdir -p launcher/native
          cp MegaTurrican.exe launcher/native/MegaTurrican.exe
          cp /mingw64/bin/SDL2.dll launcher/native/SDL2.dll
          declare -A seen=()
          queue=(MegaTurrican.exe SDL2.dll)
          while ((${#queue[@]})); do
            item="${queue[0]}"
            queue=("${queue[@]:1}")
            [[ -n "${seen[$item]:-}" ]] && continue
            seen[$item]=1
            source_file="/mingw64/bin/$item"
            [[ "$item" == "MegaTurrican.exe" ]] && source_file="$PWD/MegaTurrican.exe"
            [[ -f "$source_file" ]] || continue
            while read -r dep; do
              [[ -n "$dep" ]] || continue
              dep_path="/mingw64/bin/$dep"
              if [[ -f "$dep_path" && ! -f "launcher/native/$dep" ]]; then
                cp "$dep_path" "launcher/native/$dep"
                queue+=("$dep")
              fi
            done < <(objdump -p "$source_file" | awk '/DLL Name:/ {print $3}')
          done

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate launcher ROM persistence code
        shell: pwsh
        run: |
          $launcher = Join-Path $env:MEGATURRICAN_PROJECT 'launcher'
          node --check (Join-Path $launcher 'main.js')
          if ($LASTEXITCODE -ne 0) { throw 'Launcher main.js syntax check failed.' }
          node --check (Join-Path $launcher 'preload.js')
          if ($LASTEXITCODE -ne 0) { throw 'Launcher preload.js syntax check failed.' }
          $main = Get-Content (Join-Path $launcher 'main.js') -Raw
          $preload = Get-Content (Join-Path $launcher 'preload.js') -Raw
          $html = Get-Content (Join-Path $launcher 'index.html') -Raw
          foreach ($marker in @('rom-settings-load-last', 'rom-settings-remember', 'rom-choose')) {
            if (-not $main.Contains($marker)) { throw "Main process ROM persistence hook is missing: $marker" }
          }
          if (-not $preload.Contains("exposeInMainWorld('GenesisRom'")) { throw 'GenesisRom preload bridge is missing.' }
          foreach ($marker in @('romDirectoryStatus', 'restoreRememberedROM', 'GenesisRom.choose')) {
            if (-not $html.Contains($marker)) { throw "Launcher ROM persistence UI hook is missing: $marker" }
          }

      - name: Build portable Electron launcher
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:MEGATURRICAN_PROJECT 'launcher')
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run dist -- --x64
          if ($LASTEXITCODE -ne 0) { throw 'Electron packaging failed' }
          Pop-Location

      - name: Assemble the Windows package
        shell: pwsh
        run: |
          $project = $env:MEGATURRICAN_PROJECT
          $release = Join-Path $PWD 'release/MegaTurrican-Windows-x64'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $launchers = Get-ChildItem (Join-Path $project 'launcher/dist') -Filter '*.exe' -File
          if (-not $launchers) { throw 'Portable launcher executable was not produced.' }
          foreach ($item in $launchers) { Copy-Item $item.FullName $release }
          Copy-Item (Join-Path $project 'MegaTurrican.exe') $release
          Get-ChildItem (Join-Path $project 'launcher/native') -Filter '*.dll' -File | Copy-Item -Destination $release
          Copy-Item (Join-Path $project 'config.ini') $release
          Copy-Item (Join-Path $project 'README.txt') $release
          @'
          START HERE: run the MegaTurricanLauncher portable executable.
          In the launcher, browse to your own Mega Drive ROM and press LAUNCH MEGA TURRICAN.
          The ROM is read locally and is not uploaded.
          '@ | Set-Content -Encoding UTF8 (Join-Path $release 'START-HERE.txt')
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath (Join-Path $PWD 'MegaTurrican-Windows-x64.zip') -CompressionLevel Optimal

      - name: Verify Windows package contents
        shell: pwsh
        run: |
          $zipPath = Join-Path $PWD 'MegaTurrican-Windows-x64.zip'
          if (-not (Test-Path $zipPath)) { throw 'Windows package ZIP was not created.' }
          $entries = tar -tf $zipPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify Windows package ZIP.' }
          if (-not ($entries | Where-Object { $_ -match 'MegaTurricanLauncher.*\.exe$' })) { throw 'Portable launcher EXE is missing from the package.' }
          if (-not ($entries | Where-Object { $_ -match 'MegaTurrican\.exe$' })) { throw 'Native game EXE is missing from the package.' }
          Write-Host 'Verified EXEs in Windows package:'
          $entries | Where-Object { $_ -match '\.exe$' } | ForEach-Object { Write-Host "  $_" }

      - name: Upload ready-to-run Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MegaTurrican-Windows-x64
          path: MegaTurrican-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "windows-build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag (Join-Path $PWD 'MegaTurrican-Windows-x64.zip') --title "Mega Turrican Windows x64 - build $env:GITHUB_RUN_NUMBER" --notes "Portable Windows x64 build. Extract the ZIP, run MegaTurricanLauncher, and select your own Mega Drive ROM. No ROM is included." --prerelease