name: Build Mega Turrican for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, fix/genesis-controller-port-bits, feature/remember-rom-location, feature/audio-settings-and-icon, fix/quit-to-title-build210, fix/persist-game-options-and-gameplay-pause, fix/portable-settings-and-gameplay-pause, feature/imgui-level-builder-foundation, feature/level-builder-standalone-game-screen, feature/level-builder-maker-ui-vdp]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'build-overrides/**'
      - 'MegaTurrican_Windows_Build_Kit.zip.enc'

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate encrypted source and secret
        shell: pwsh
        env:
          MEGATURRICAN_SOURCE_KEY: ${{ secrets.MEGATURRICAN_SOURCE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MEGATURRICAN_SOURCE_KEY)) {
            throw 'Missing repository Actions secret MEGATURRICAN_SOURCE_KEY.'
          }
          if (-not (Test-Path (Join-Path $PWD 'MegaTurrican_Windows_Build_Kit.zip.enc'))) {
            throw 'Missing MegaTurrican_Windows_Build_Kit.zip.enc in the repository root.'
          }

      - name: Install MinGW-w64, SDL2, and OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Fetch pinned Dear ImGui 1.93.0 source
        shell: pwsh
        run: |
          $imgui = Join-Path $PWD '_imgui-source'
          git clone --depth 1 --branch v1.93.0 https://github.com/ocornut/imgui.git $imgui
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch Dear ImGui v1.93.0.' }
          $actual = (git -C $imgui rev-parse HEAD).Trim()
          if ($actual -ne 'c1aaac65e896a45f81f47a4d68f9959e0f86c859') { throw "Unexpected Dear ImGui source revision: $actual" }
          "IMGUI_SOURCE=$imgui" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch pinned RmlUi 6.3 source
        shell: pwsh
        run: |
          $rmlui = Join-Path $PWD '_rmlui-source'
          git clone --depth 1 --branch 6.3 https://github.com/mikke89/RmlUi.git $rmlui
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch RmlUi 6.3.' }
          $actual = (git -C $rmlui rev-parse HEAD).Trim()
          if ($actual -ne 'ba95ffe8bfb6370efb2cdcca927eaad4710c5413') { throw "Unexpected RmlUi source revision: $actual" }
          $prefix = Join-Path $PWD '_rmlui-install'
          $build = Join-Path $PWD '_rmlui-build'
          "RMLUI_SOURCE=$rmlui" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RMLUI_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RMLUI_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build pinned RmlUi core for the existing SDL2 renderer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rmlui_source="$(cygpath -u "$RMLUI_SOURCE")"
          rmlui_build="$(cygpath -u "$RMLUI_BUILD")"
          rmlui_prefix="$(cygpath -u "$RMLUI_PREFIX")"
          cmake -S "$rmlui_source" -B "$rmlui_build" -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            -DRMLUI_SAMPLES=OFF \
            -DRMLUI_FONT_ENGINE=freetype \
            -DRMLUI_PRECOMPILED_HEADERS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$rmlui_prefix"
          cmake --build "$rmlui_build" --target install --parallel 2
          test -s "$rmlui_prefix/lib/librmlui.a"
          test -s "$rmlui_source/LICENSE.txt"
          echo "RmlUi 6.3 static core installed for the Maker UI."

      - name: Decrypt private source bundle
        shell: msys2 {0}
        env:
          MEGATURRICAN_SOURCE_KEY: ${{ secrets.MEGATURRICAN_SOURCE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MEGATURRICAN_SOURCE_KEY"
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 -in MegaTurrican_Windows_Build_Kit.zip.enc -out MegaTurrican_Windows_Build_Kit.zip -pass env:MEGATURRICAN_SOURCE_KEY
          test -s MegaTurrican_Windows_Build_Kit.zip

      - name: Extract and validate private source bundle
        shell: pwsh
        run: |
          $destination = Join-Path $PWD '_build-source'
          Expand-Archive -LiteralPath (Join-Path $PWD 'MegaTurrican_Windows_Build_Kit.zip') -DestinationPath $destination -Force
          $project = Join-Path $destination 'MegaTurrican_Windows_Build_Kit'
          foreach ($required in @('recomp_gen.c', 'runtime/harness.c', 'launcher/package.json', 'config.ini')) {
            if (-not (Test-Path (Join-Path $project $required))) {
              throw "Source bundle is incomplete: $required is missing."
            }
          }
          $patchScript = Join-Path $PWD 'build-overrides/patch-launcher.ps1'
          if (-not (Test-Path $patchScript)) { throw 'Launcher patch script is missing.' }
          & $patchScript -ProjectRoot $project

          # Install the updated in-game pause/options menu from the supplied WindowsPort source.
          $menuPayload = Join-Path $PWD 'build-overrides/ingame-menu-sdl_main.c.gz.b64'
          if (-not (Test-Path -LiteralPath $menuPayload)) { throw 'Updated in-game menu source payload is missing.' }
          $compressed = [Convert]::FromBase64String((Get-Content -LiteralPath $menuPayload -Raw).Trim())
          $inputStream = [System.IO.MemoryStream]::new($compressed)
          $outputStream = [System.IO.MemoryStream]::new()
          $gzipStream = [System.IO.Compression.GZipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
          try { $gzipStream.CopyTo($outputStream) } finally { $gzipStream.Dispose(); $inputStream.Dispose() }
          $menuSourcePath = Join-Path $project 'runtime/sdl_main.c'
          [System.IO.File]::WriteAllBytes($menuSourcePath, $outputStream.ToArray())
          $outputStream.Dispose()
          $menuHash = (Get-FileHash -LiteralPath $menuSourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($menuHash -ne '96981beaa64122b40786dfdac8788323f582979bb26a88c4584ab42777f1deaa') {
            throw "Updated in-game menu source checksum mismatch: $menuHash"
          }
          Write-Host 'Installed updated in-game pause/options menu source.'

          "MEGATURRICAN_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Set up Python for build patches
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for Windows icon conversion
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Installing Pillow for icon conversion failed.' }

      - name: Apply Genesis controller UI and native mappings
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-controller-menu.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Applying Genesis controller changes failed.' }

      - name: Apply launcher audio options and game icon
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-audio.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Applying audio and icon changes failed.' }

      - name: Embed Reborn intro and persistent title branding
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-reborn-title.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Embedding the Reborn title animation failed.' }

      - name: Install native VDP pause and controller menus
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-native-game-menus.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Installing native VDP pause and controller menus failed.' }

      - name: Install native gameplay cheats, continues patch, and save slots
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/patch-custom-runtime.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Installing native gameplay options and save slots failed.' }
          python (Join-Path $PWD 'build-overrides/patch-custom-game-menus.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Installing native Extras menus failed.' }
          python (Join-Path $PWD 'build-overrides/patch-imgui-level-builder.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Installing the ImGui Level Builder failed.' }

      - name: Inspect static recomp gameplay hooks
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/inspect-static-recomp.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Static recomp diagnostics failed.' }

      - name: Generate built-in Maker sprite descriptor index
        shell: pwsh
        run: |
          python (Join-Path $PWD 'build-overrides/generate-maker-asset-catalog.py') $env:MEGATURRICAN_PROJECT
          if ($LASTEXITCODE -ne 0) { throw 'Generating the Maker sprite descriptor index failed.' }

      - name: Upload private runtime state report
        uses: actions/upload-artifact@v4
        with:
          name: MegaTurrican-runtime-state-report
          path: runtime-state-report.txt
          retention-days: 3

      - name: Compile native Windows game core
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/build-overrides"
          windres MegaTurrican.rc -O coff -o "$(cygpath -u "$MEGATURRICAN_PROJECT")/MegaTurrican-icon.o"
          cd "$(cygpath -u "$MEGATURRICAN_PROJECT")"
          sdl_version="$(sdl2-config --version)"
          IFS=. read -r sdl_major sdl_minor sdl_patch <<< "$sdl_version"
          if (( sdl_major < 2 || (sdl_major == 2 && (sdl_minor < 0 || (sdl_minor == 0 && sdl_patch < 17))) )); then
            echo "Dear ImGui SDL_Renderer2 backend requires SDL 2.0.17 or newer (found $sdl_version)."
            exit 1
          fi
          mkdir -p _objects
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c recomp_gen.c -o _objects/recomp_gen.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/harness.c -o _objects/harness.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/vdp.c -o _objects/vdp.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/m68k_interp.c -o _objects/m68k_interp.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/z80.c -o _objects/z80.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/ym2612.c -o _objects/ym2612.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/psg.c -o _objects/psg.o
          gcc -O0 -DMD_SDL -fno-strict-aliasing -Wno-unused-label -Wno-unused-variable $(sdl2-config --cflags) -Iruntime -c runtime/sdl_main.c -o _objects/sdl_main.o
          g++ -O2 -std=c++11 $(sdl2-config --cflags) -I"$IMGUI_SOURCE" -I"$IMGUI_SOURCE/backends" -Iruntime -c runtime/mt_level_builder_imgui.cpp -o _objects/mt_level_builder_imgui.o
          for source in imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp; do
            g++ -O2 -std=c++11 $(sdl2-config --cflags) -I"$IMGUI_SOURCE" -c "$IMGUI_SOURCE/$source" -o "_objects/${source%.cpp}.o"
          done
          for source in imgui_impl_sdl2.cpp imgui_impl_sdlrenderer2.cpp; do
            g++ -O2 -std=c++11 $(sdl2-config --cflags) -I"$IMGUI_SOURCE" -I"$IMGUI_SOURCE/backends" -c "$IMGUI_SOURCE/backends/$source" -o "_objects/${source%.cpp}.o"
          done
          rmlui_source="$(cygpath -u "$RMLUI_SOURCE")"
          rmlui_prefix="$(cygpath -u "$RMLUI_PREFIX")"
          rmlui_includes="-I$rmlui_source/Include -I$rmlui_source/Backends -DRMLUI_SDL_VERSION_MAJOR=2"
          g++ -O2 -std=c++17 $(sdl2-config --cflags) $rmlui_includes -Iruntime -c runtime/mt_level_builder_rmlui.cpp -o _objects/mt_level_builder_rmlui.o
          g++ -O2 -std=c++17 $(sdl2-config --cflags) $rmlui_includes -c "$rmlui_source/Backends/RmlUi_Platform_SDL.cpp" -o _objects/rmlui_platform_sdl.o
          g++ -O2 -std=c++17 $(sdl2-config --cflags) $rmlui_includes -c "$rmlui_source/Backends/RmlUi_Renderer_SDL.cpp" -o _objects/rmlui_renderer_sdl.o
          g++ _objects/*.o MegaTurrican-icon.o "$rmlui_prefix/lib/librmlui.a" -lSDL2_image -lfreetype $(sdl2-config --libs) -lm -static-libgcc -static-libstdc++ -mwindows -o MegaTurrican.exe
          test -s MegaTurrican.exe
          mkdir -p launcher/native
          cp MegaTurrican.exe launcher/native/MegaTurrican.exe
          cp /mingw64/bin/SDL2.dll launcher/native/SDL2.dll
          declare -A seen=()
          queue=(MegaTurrican.exe SDL2.dll)
          while ((${#queue[@]})); do
            item="${queue[0]}"
            queue=("${queue[@]:1}")
            [[ -n "${seen[$item]:-}" ]] && continue
            seen[$item]=1
            source_file="/mingw64/bin/$item"
            [[ "$item" == "MegaTurrican.exe" ]] && source_file="$PWD/MegaTurrican.exe"
            [[ -f "$source_file" ]] || continue
            while read -r dep; do
              [[ -n "$dep" ]] || continue
              dep_path="/mingw64/bin/$dep"
              if [[ -f "$dep_path" && ! -f "launcher/native/$dep" ]]; then
                cp "$dep_path" "launcher/native/$dep"
                queue+=("$dep")
              fi
            done < <(objdump -p "$source_file" | awk '/DLL Name:/ {print $3}')
          done

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate launcher ROM persistence code
        shell: pwsh
        run: |
          $launcher = Join-Path $env:MEGATURRICAN_PROJECT 'launcher'
          node --check (Join-Path $launcher 'main.js')
          if ($LASTEXITCODE -ne 0) { throw 'Launcher main.js syntax check failed.' }
          node --check (Join-Path $launcher 'preload.js')
          if ($LASTEXITCODE -ne 0) { throw 'Launcher preload.js syntax check failed.' }
          $main = Get-Content (Join-Path $launcher 'main.js') -Raw
          $preload = Get-Content (Join-Path $launcher 'preload.js') -Raw
          $html = Get-Content (Join-Path $launcher 'index.html') -Raw
          foreach ($marker in @('rom-settings-load-last', 'rom-settings-remember', 'rom-choose')) {
            if (-not $main.Contains($marker)) { throw "Main process ROM persistence hook is missing: $marker" }
          }
          if (-not $preload.Contains("exposeInMainWorld('GenesisRom'")) { throw 'GenesisRom preload bridge is missing.' }
          foreach ($marker in @('romDirectoryStatus', 'restoreRememberedROM', 'GenesisRom.choose')) {
            if (-not $html.Contains($marker)) { throw "Launcher ROM persistence UI hook is missing: $marker" }
          }

      - name: Build portable Electron launcher
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:MEGATURRICAN_PROJECT 'launcher')
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run dist -- --x64
          if ($LASTEXITCODE -ne 0) { throw 'Electron packaging failed' }
          Pop-Location

      - name: Assemble the Windows package
        shell: pwsh
        run: |
          $project = $env:MEGATURRICAN_PROJECT
          $release = Join-Path $PWD 'release/MegaTurrican-Windows-x64'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $launchers = Get-ChildItem (Join-Path $project 'launcher/dist') -Filter '*.exe' -File
          if (-not $launchers) { throw 'Portable launcher executable was not produced.' }
          foreach ($item in $launchers) { Copy-Item $item.FullName $release }
          Copy-Item (Join-Path $project 'MegaTurrican.exe') $release
          Get-ChildItem (Join-Path $project 'launcher/native') -Filter '*.dll' -File | Copy-Item -Destination $release
          Copy-Item (Join-Path $project 'config.ini') $release
          Copy-Item (Join-Path $project 'README.txt') $release
          Copy-Item (Join-Path $env:RMLUI_SOURCE 'LICENSE.txt') (Join-Path $release 'RmlUi-LICENSE.txt')
          @'
          START HERE: run the MegaTurricanLauncher portable executable.
          In the launcher, browse to your own Mega Drive ROM and press LAUNCH MEGA TURRICAN.
          The ROM is read locally and is not uploaded.
          '@ | Set-Content -Encoding UTF8 (Join-Path $release 'START-HERE.txt')
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath (Join-Path $PWD 'MegaTurrican-Windows-x64.zip') -CompressionLevel Optimal

      - name: Verify Windows package contents
        shell: pwsh
        run: |
          $zipPath = Join-Path $PWD 'MegaTurrican-Windows-x64.zip'
          if (-not (Test-Path $zipPath)) { throw 'Windows package ZIP was not created.' }
          $entries = tar -tf $zipPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify Windows package ZIP.' }
          if (-not ($entries | Where-Object { $_ -match 'MegaTurricanLauncher.*\.exe$' })) { throw 'Portable launcher EXE is missing from the package.' }
          if (-not ($entries | Where-Object { $_ -match 'MegaTurrican\.exe$' })) { throw 'Native game EXE is missing from the package.' }
          Write-Host 'Verified EXEs in Windows package:'
          $entries | Where-Object { $_ -match '\.exe$' } | ForEach-Object { Write-Host "  $_" }

      - name: Upload ready-to-run Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MegaTurrican-Windows-x64
          path: MegaTurrican-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "windows-build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag (Join-Path $PWD 'MegaTurrican-Windows-x64.zip') --title "Mega Turrican Windows x64 - build $env:GITHUB_RUN_NUMBER" --notes "Portable Windows x64 build. Extract the ZIP, run MegaTurricanLauncher, and select your own Mega Drive ROM. No ROM is included." --prerelease